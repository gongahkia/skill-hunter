<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Judgeman</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <div class="brand-title">Judgeman</div>
        <div class="brand-subtitle" id="caseTitle">ELIT judgment helper</div>
      </div>
    </header>

    <main class="main">
      <section class="card">
        <div class="card-title">Readable view</div>
        <p class="muted">
          Opens a non-destructive reader overlay on supported ELIT judgment pages.
        </p>
        <div class="row">
          <button id="toggleBtn" class="btn btn-primary" type="button">Toggle readable view</button>
          <button id="refreshBtn" class="btn btn-quiet" type="button">Refresh</button>
        </div>
      </section>

      <section class="card">
        <div class="card-title">Structured export</div>
        <p class="muted">
          Copies the locally extracted case JSON. No page content leaves the browser in this build.
        </p>
        <div class="row">
          <button id="copyCaseBtn" class="btn btn-secondary" type="button">Copy case JSON</button>
        </div>
      </section>

      <section class="card">
        <div class="card-title">Status</div>
        <p class="muted" id="status">Ready.</p>
      </section>
    </main>

    <script src="browserApi.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
