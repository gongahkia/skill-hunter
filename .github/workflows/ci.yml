name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  webext:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/webext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies
        run: |
          npm ci
      - name: Validate challenge packs
        run: |
          npm run validate:packs
      - name: Install shared dependencies
        run: |
          cd src/shared
          npm install
      - name: Run shared tests
        run: |
          cd src/shared
          npm test -- --runInBand
      - name: Build extension bundles
        run: |
          npm run build
